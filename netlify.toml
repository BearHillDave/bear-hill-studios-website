[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security headers on every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Images, audio and icons change rarely; let browsers cache them for a week.
# (Not immutable: filenames aren't versioned, so a replaced file must still
# be picked up eventually.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Point the Netlify subdomain at the real domain so it isn't indexed twice
[[redirects]]
  from = "https://bear-hill-studios-site.netlify.app/*"
  to = "https://bearhillstudios.co.uk/:splat"
  status = 301
  force = true
